<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2259" />
    <script>
      // Applies the saved mode before the first paint, so dark mode doesn't flash white.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#0B1428';
        }
      } catch {}
    </script>
    <title>FixIT · Trusted local services near you</title>
    <meta name="description" content="FixIT connects you with verified plumbers, electricians, automotive technicians, cleaners and more near you, with transparent prices, real reviews and booking in your language." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
